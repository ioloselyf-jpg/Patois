<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<title>Likkle Bit Menu Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone-first trainer. Sticky tab bar, one working area below it. Patois brand: green, mustard, cream. */
:root{
  --bg:#FDF3DC; --card:#FFF9EA; --card2:#F8E6B0; --fg:#2B2118; --muted:#6B5636;
  --green:#277A3D; --green-ink:#FFFFFF; --mustard:#E8960A; --rust:#B4410A; --line:#E3B95F;
  --ok:#277A3D; --warn:#B4410A; --chip:#F3DCA0;
  --f-display:'Fredoka','Poppins',system-ui,sans-serif; --f-body:'Poppins',system-ui,sans-serif;
  --logo-light:block; --logo-dark:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13241A; --card:#1B3224; --card2:#244230; --fg:#FBEFD0; --muted:#C5B98F;
    --green:#5CC079; --green-ink:#10200F; --mustard:#F3B33D; --rust:#FF9A63; --line:#3B5A44;
    --ok:#7ADB96; --warn:#FFB07E; --chip:#2B4A37; --logo-light:none; --logo-dark:block; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13241A; --card:#1B3224; --card2:#244230; --fg:#FBEFD0; --muted:#C5B98F;
  --green:#5CC079; --green-ink:#10200F; --mustard:#F3B33D; --rust:#FF9A63; --line:#3B5A44;
  --ok:#7ADB96; --warn:#FFB07E; --chip:#2B4A37; --logo-light:none; --logo-dark:block; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
header{padding:18px 0 10px;display:flex;align-items:center;gap:14px;justify-content:space-between}
header img{height:46px;width:auto}
.logo-l{display:var(--logo-light)} .logo-d{display:var(--logo-dark)}
header .t{text-align:right}
header h1{font-size:22px;line-height:1.1;color:var(--green)}
header p{margin:2px 0 0;color:var(--muted);font-size:12px}
.warn{background:var(--card2);border:1.5px solid var(--rust);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.45;margin:6px 0 12px}
.warn b{color:var(--rust)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 10px;display:flex;gap:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav button{flex:1;font:600 13px var(--f-body);padding:10px 4px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
nav button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
button:focus-visible,summary:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font:500 12.5px var(--f-body);padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--mustard);border-color:var(--mustard);color:#2B2118}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 14px var(--f-body);padding:11px 16px;border-radius:12px;border:2px solid var(--green);background:var(--green);color:var(--green-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.warnb{background:transparent;color:var(--rust);border-color:var(--rust)}
.btn:disabled{opacity:.45;cursor:default}
.stat{font-size:13px;color:var(--muted);margin:0 0 10px}
.stat b{color:var(--fg)}
.bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}

/* flashcard */
.card{background:var(--card);border:2px solid var(--fg);border-radius:18px;padding:18px;min-height:360px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;width:100%;color:var(--fg);font:inherit}
.card .top{display:flex;gap:12px;align-items:center}
.card .top img{width:64px;height:64px;border-radius:50%;flex:none;border:2px solid var(--line)}
.card h2{font-size:24px;line-height:1.15;color:var(--green)}
.price{font:600 17px var(--f-display);color:var(--rust)}
.sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hint{margin-top:auto;font-size:12.5px;color:var(--muted);text-align:center}
.big{font-size:15.5px}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--rust);margin:0 0 2px}
.blk{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip)}
.al{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1.5px solid var(--rust);color:var(--rust)}
.al.likely{background:var(--rust);color:var(--bg)}
.say{font-style:italic;color:var(--muted)}
.heat{display:inline-flex;gap:3px;vertical-align:middle}
.heat i{width:9px;height:9px;border-radius:50%;background:var(--chip);border:1px solid var(--line)}
.heat i.on{background:var(--rust);border-color:var(--rust)}
.nodata{color:var(--muted);font-size:13px}

/* quiz */
.q{background:var(--card);border:2px solid var(--fg);border-radius:18px;padding:18px}
.opt.sel{border-color:var(--mustard);background:color-mix(in srgb,var(--mustard) 25%,transparent)}
.field{flex:1;min-width:120px;font:16px var(--f-body);padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.q h3{font-size:19px;line-height:1.3;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{font:500 14.5px var(--f-body);text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent)}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 22%,transparent)}
.fb{margin:12px 0 0;font-size:13.5px}
.score{font:600 40px var(--f-display);color:var(--green)}
.miss{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.miss li{line-height:1.45;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px}

/* allergens + menu */
.group{margin:14px 0 6px;font-size:14px;font-weight:600}
.dish{background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin:0 0 8px}
.dish summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.dish summary::-webkit-details-marker{display:none}
.dish summary span:first-child{font-weight:600;font-size:14px}
.dish .in{padding:0 14px 14px;display:grid;gap:10px;font-size:13.5px}
.dish .p{font:600 14px var(--f-display);color:var(--rust);white-space:nowrap}
input[type=search]{width:100%;font:15px var(--f-body);padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);margin:0 0 12px}
.sech{font-size:18px;color:var(--green);margin:18px 0 8px}
.sech small{font:500 12px var(--f-body);color:var(--muted);margin-left:6px}
.legend{font-size:12px;color:var(--muted);margin:0 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

/* ---------- Cards ---------- */
const C={sec:"all",rev:false,deck:[],i:0,flip:false,onlyLearning:false};
function buildDeck(){let a=D.filter(d=>C.sec==="all"||d.s===C.sec);if(C.onlyLearning)a=a.filter(d=>!known.has(d.id));C.deck=shuffle(a);C.i=0;C.flip=false}
function cardFront(d){
  if(!C.rev) return `<div class="top"><img alt="" src="${SECS[d.s].img}"><div><div class="sec">${SECS[d.s].n}</div><h2>${esc(d.name)}</h2></div></div><p class="hint" style="margin-top:auto">What is in it? How hot? What allergens? Tap to flip.</p>`;
  return `<div class="sec">${SECS[d.s].n} · which dish is this?</div><p class="big blk">${esc(d.desc)}</p><p class="blk">Heat ${heatHTML(d.heat)}</p><p class="hint">Name it and the price, then tap to flip.</p>`;
}
function cardBack(d){
  return `<div class="top"><img alt="" src="${SECS[d.s].img}"><div><div class="sec">${SECS[d.s].n}</div><h2>${esc(d.name)}</h2><span class="price">${money(d.price)}</span></div></div>
  <p class="blk big">${esc(d.desc)}</p>
  <div><p class="lab">Key ingredients</p><div class="tags">${d.ing.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div>
  <div><p class="lab">Flavour</p><p class="blk">${esc(d.flavour)} Heat ${heatHTML(d.heat)}</p></div>
  <div><p class="lab">Allergens (draft)</p><div class="tags">${alTags(d)}</div>${d.diet?`<p class="nodata" style="margin:6px 0 0">${esc(d.diet)}</p>`:""}</div>
  <div><p class="lab">Say it like this</p><p class="blk say">“${esc(d.say)}”</p></div>`;
}
function renderCards(){
  const v=$("#view");
  if(!C.deck.length&&!C.built){buildDeck();C.built=true}
  const total=D.filter(d=>C.sec==="all"||d.s===C.sec).length;
  const kn=D.filter(d=>(C.sec==="all"||d.s===C.sec)&&known.has(d.id)).length;
  const d=C.deck[C.i];
  let h=`<div class="chips" role="group" aria-label="Menu section">${[["all","All"],...Object.entries(SECS).map(([k,s])=>[k,s.n])].map(([k,n])=>`<button class="chip" aria-pressed="${C.sec===k}" data-sec="${k}">${n}</button>`).join("")}</div>
  <div class="row" style="margin-bottom:10px"><button class="chip" aria-pressed="${C.rev}" id="rev">Guess the dish from the description</button><button class="chip" aria-pressed="${C.onlyLearning}" id="onlyl">Only ones I'm still learning</button></div>
  <p class="stat"><b>${kn}</b> of ${total} known${d?` · card ${C.i+1} of ${C.deck.length}`:""}</p><div class="bar"><i style="width:${total?kn/total*100:0}%"></i></div>`;
  if(!d){h+=`<div class="q"><h3>${C.onlyLearning?"Nothing left to learn here.":"No cards."}</h3><p class="nodata">${C.onlyLearning?"You marked every card in this section as known. Reset to go again.":""}</p><div class="row"><button class="btn" id="reset">Reset progress</button></div></div>`;v.innerHTML=h;wireCards();return}
  h+=`<button class="card" id="card" aria-label="Flashcard, tap to flip">${C.flip?cardBack(d):cardFront(d)}</button>
  <div class="row" style="margin-top:12px"><button class="btn warnb" id="again" style="flex:1">Still learning</button><button class="btn" id="got" style="flex:1">Got it</button></div>
  <div class="row" style="margin-top:10px"><button class="btn alt" id="prev" ${C.i===0?"disabled":""}>Back</button><button class="btn alt" id="shuf">Shuffle</button><button class="btn alt" id="reset">Reset progress</button></div>`;
  v.innerHTML=h;wireCards();
}
function wireCards(){
  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{C.sec=b.dataset.sec;buildDeck();renderCards()});
  const on=(id,f)=>{const e=$("#"+id);if(e)e.onclick=f};
  on("rev",()=>{C.rev=!C.rev;C.flip=false;renderCards()});
  on("onlyl",()=>{C.onlyLearning=!C.onlyLearning;buildDeck();renderCards()});
  on("card",()=>{C.flip=!C.flip;renderCards();$("#card")&&$("#card").focus()});
  const next=()=>{C.flip=false;if(C.i<C.deck.length-1)C.i++;else{buildDeck()}renderCards()};
  on("got",()=>{known.add(C.deck[C.i].id);saveKnown();next()});
  on("again",()=>{known.delete(C.deck[C.i].id);saveKnown();next()});
  on("prev",()=>{C.i=Math.max(0,C.i-1);C.flip=false;renderCards()});
  on("shuf",()=>{buildDeck();renderCards()});
  on("reset",()=>{known=new Set();saveKnown();C.onlyLearning=false;buildDeck();renderCards()});
}

  ()=>{const d=pick1(MAINS);const k=pick1([...d.likely,...d.check,...pick(ALL.map(a=>a[0]).filter(a=>!d.likely.includes(a)&&!d.check.includes(a)),1)]);const st=d.likely.includes(k)?"Likely contains it":d.check.includes(k)?"Ask the kitchen":"Nothing flagged";return {t:"mc",cat:"al",q:`${d.name}: what do we know about ${AN[k].toLowerCase()}?`,opts:["Likely contains it","Ask the kitchen","Nothing flagged"],ans:st,why:`${AN[k]} in the ${d.name}: ${st.toLowerCase()} (draft data). Always confirm with the kitchen.`}},
  ()=>{const d=pick1(MAINS.filter(x=>x.likely.length));const dec=pick(ALL.map(a=>a[0]).filter(a=>!d.likely.includes(a)&&!d.check.includes(a)),Math.max(2,6-d.likely.length));const o=shuffle([...d.likely,...dec]).map(k=>AN[k]);return {t:"multi",cat:"al",q:`Select every allergen flagged as likely in the ${d.name}.`,opts:o,ans:d.likely.map(k=>AN[k]),why:`${d.name}: likely ${d.likely.map(k=>AN[k]).join(", ")}. Ask the kitchen about: ${d.check.map(k=>AN[k]).join(", ")||"nothing extra"}.`}},
  ()=>{const [k,a]=pick1(ONE);const d=a[0];const w=shuffle(MAINS.filter(x=>x.id!==d.id&&!x.likely.includes(k)&&!x.check.includes(k))).slice(0,3);return mc("al",`A guest cannot have ${AN[k].toLowerCase()}. Which dish must you not recommend?`,d.name,w.map(x=>x.name),`${d.name} is flagged as likely containing ${AN[k].toLowerCase()}. Confirm with the kitchen.`)},
  ()=>{const d=pick1(MAINS.filter(x=>x.check.length));const k=pick1(d.check);const w=shuffle(MAINS.filter(x=>x.id!==d.id&&!x.likely.includes(k)&&!x.check.includes(k))).slice(0,3);return mc("al",`Which of these needs a kitchen check for ${AN[k].toLowerCase()}?`,d.name,w.map(x=>x.name),`${d.name}: ${AN[k].toLowerCase()} is possible in this kind of dish, so ask the kitchen.`)}
 ]
};
GEN.menu.push(()=>{const id=pick1(Object.keys(ACC));const d=D.find(x=>x.id==id);return mc("menu",`What is the ${d.name} served with?`,ACC[id],pick(Object.entries(ACC).filter(([k])=>k!=id).map(([,v])=>v),3),`The ${d.name} comes with ${ACC[id]}.`)});
GEN.menu.push(()=>{const id=pick1(Object.keys(ACC));const d=D.find(x=>x.id==id);return mc("menu",`Which dish is served with ${ACC[id]}?`,d.name,distract(d,3).map(x=>x.name),`${d.name} comes with ${ACC[id]}.`)});
GEN.menu.push(()=>mc("menu","Extra bread and extra green plantain chips each cost how much?","£2.50",["£1.50","£2.00","£3.00"],"Both extras are £2.50."));
const factQ=f=>({t:"mc",cat:f.c==="history"?"pantry":f.c==="nikkai"?"patois":f.c,q:f.q,ans:f.a,opts:shuffle([f.a,...f.w]),why:f.why});
const taglineQ=()=>{const T={"Likkle Plates, Nuff Flavour.":"Likkle Bit","Bigga plates. Come share.":"Beg Yuh Some","Every likkle bit counts.":"Pon Di Side","Save a likkle room.":"Sweet Dem Up"};const [t,n]=pick1(Object.entries(T));return mc("patois",`Which menu section has the tagline "${t}"?`,n,Object.values(T).filter(x=>x!==n),`"${t}" belongs to ${n}.`)};
function makeQs(cat,n){
  const out=[],seen=new Set();
  const facts=shuffle(FACTS);let fi=0;
  const pickFacts=cs=>{while(fi<facts.length){const f=facts[fi++];if(cs.includes(f.c))return factQ(f)}return null};
  const builders={
    menu:()=>pick1(GEN.menu)(), al:()=>pick1(GEN.al)(),
    pantry:()=>pickFacts(["pantry","history"])||pick1(GEN.menu)(),
    patois:()=>Math.random()<.2?taglineQ():(pickFacts(["patois","nikkai"])||taglineQ())
  };
  const weights=cat==="mixed"?["menu","menu","menu","al","pantry","pantry","patois"]:[cat];
  let guard=0;
  while(out.length<n&&guard++<400){
    const q=builders[pick1(weights)]();
    if(!q||seen.has(q.q))continue;
    if(q.t!=="type"&&new Set(q.opts).size!==q.opts.length)continue;
    seen.add(q.q);out.push(q);
  }
  return out;
}
let Q={stage:"setup",cat:"mixed",n:15,exam:false,qs:[],i:0,res:[],sel:new Set(),done:false};
function renderQuiz(){
  const v=$("#view");
  if(Q.stage==="setup"){
    v.innerHTML=`<div class="q"><p class="sec">Quiz</p><h3>Pick your round</h3>
    <p class="lab">Topic</p><div class="chips" role="group" aria-label="Topic">${[["mixed","Mixed (hardest)"],["menu","Dishes and ingredients"],["pantry","Pantry and history"],["al","Allergens"],["patois","Patois, words and Nikkai"]].map(([k,n])=>`<button class="chip" aria-pressed="${Q.cat===k}" data-cat="${k}">${n}</button>`).join("")}</div>
    <p class="lab">Length</p><div class="chips" role="group" aria-label="Length">${[10,15,25].map(n=>`<button class="chip" aria-pressed="${Q.n===n}" data-n="${n}">${n} questions</button>`).join("")}</div>
    <p class="lab">Mode</p><div class="chips"><button class="chip" aria-pressed="${Q.exam}" id="exam">Exam mode: no feedback until the end</button></div>
    <p class="nodata">Questions include picking out ingredients, spotting what is NOT in a dish, selecting everything in a dish, typing prices, allergen calls and handbook facts. Allergen answers use the draft data.</p>
    <div class="row" style="margin-top:12px"><button class="btn" id="start">Start</button></div></div>`;
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{Q.cat=b.dataset.cat;renderQuiz()});
    document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{Q.n=+b.dataset.n;renderQuiz()});
    $("#exam").onclick=()=>{Q.exam=!Q.exam;renderQuiz()};
    $("#start").onclick=()=>{Q.qs=makeQs(Q.cat,Q.n);Q.i=0;Q.res=[];Q.stage="run";renderQuiz()};
    return;
  }
  if(Q.stage==="done"){
    const sc=Q.res.filter(r=>r.ok).length,tot=Q.res.length;
    const by={};Q.res.forEach(r=>{(by[r.cat]=by[r.cat]||[0,0]);by[r.cat][1]++;if(r.ok)by[r.cat][0]++});
    const miss=Q.res.filter(r=>!r.ok);
    v.innerHTML=`<div class="q"><p class="sec">Quiz complete</p><p class="score">${sc} / ${tot}</p><p class="stat">${Math.round(sc/tot*100)}%</p>
    <div class="tags" style="margin-bottom:12px">${Object.entries(by).map(([c,[a,b]])=>`<span class="tag">${CATN[c]}: ${a}/${b}</span>`).join("")}</div>
    ${miss.length?`<p class="lab">Review (${miss.length} missed)</p><ul class="miss">${miss.map(m=>`<li><b>${esc(m.q)}</b><br>You said: ${esc(m.yours||"no answer")}<br>Answer: ${esc(m.correct)}<br><span class="nodata">${esc(m.why)}</span></li>`).join("")}</ul>`:`<p>Clean sweep.</p>`}
    <div class="row" style="margin-top:14px"><button class="btn" id="again">New round</button><button class="btn alt" id="redo">Same settings</button></div></div>`;
    $("#again").onclick=()=>{Q.stage="setup";renderQuiz()};
    $("#redo").onclick=()=>{Q.qs=makeQs(Q.cat,Q.n);Q.i=0;Q.res=[];Q.sel=new Set();Q.stage="run";renderQuiz()};
    return;
  }
  const q=Q.qs[Q.i];Q.sel=new Set();let locked=false;
  const last=Q.i===Q.qs.length-1;
  let body="";
  if(q.t==="mc")body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  else if(q.t==="multi")body=`<p class="nodata" style="margin:-6px 0 8px">Select all that apply, then lock in.</p><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("")}</div><div class="row" style="margin-top:10px"><button class="btn" id="lock">Lock in</button></div>`;
  else body=`<div class="row"><label class="sr" for="ans">Your answer</label><input type="text" inputmode="decimal" id="ans" class="field" placeholder="e.g. 7.50" autocomplete="off"><button class="btn" id="lock">Submit</button></div>`;
  v.innerHTML=`<p class="stat">Question <b>${Q.i+1}</b> of ${Q.qs.length}${Q.exam?" · exam mode":` · score <b>${Q.res.filter(r=>r.ok).length}</b>`}</p><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
  <div class="q"><p class="sec">${CATN[q.cat]}</p><h3>${esc(q.q)}</h3>${body}<p class="fb" id="fb" aria-live="polite"></p><div class="row" style="margin-top:12px"><button class="btn" id="nx" hidden>${last?"See score":"Next"}</button></div></div>`;
  const finish=(ok,yours,correct)=>{
    if(locked)return;locked=true;
    Q.res.push({q:q.q,ok,yours,correct,why:q.why,cat:q.cat});
    document.querySelectorAll(".opt,#lock,#ans").forEach(x=>x.disabled=true);
    if(Q.exam){go();return}
    $("#fb").textContent=(ok?"Correct. ":"Not quite. ")+q.why;$("#nx").hidden=false;$("#nx").focus();
  };
  const go=()=>{if(Q.i<Q.qs.length-1){Q.i++}else{Q.stage="done"}renderQuiz()};
  $("#nx").onclick=go;
  if(q.t==="mc"){
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(locked)return;const o=q.opts[+b.dataset.i],ok=o===q.ans;
      if(!Q.exam){document.querySelectorAll(".opt").forEach(x=>{if(q.opts[+x.dataset.i]===q.ans)x.classList.add("right")});if(!ok)b.classList.add("wrong")}
      finish(ok,o,q.ans);
    });
  }else if(q.t==="multi"){
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;const i=+b.dataset.i;Q.sel.has(i)?Q.sel.delete(i):Q.sel.add(i);b.classList.toggle("sel",Q.sel.has(i));b.setAttribute("aria-pressed",Q.sel.has(i))});
    $("#lock").onclick=()=>{
      if(locked)return;const pickd=[...Q.sel].map(i=>q.opts[i]),ok=pickd.length===q.ans.length&&q.ans.every(a=>pickd.includes(a));
      if(!Q.exam)document.querySelectorAll(".opt").forEach(x=>{const o=q.opts[+x.dataset.i],isA=q.ans.includes(o),isP=pickd.includes(o);if(isA)x.classList.add("right");else if(isP)x.classList.add("wrong")});
      finish(ok,pickd.join(", "),q.ans.join(", "));
    };
  }else{
    const sub=()=>{if(locked)return;const raw=$("#ans").value,n=parseFloat(raw.replace(/[£\s]/g,""));finish(Math.abs(n-q.ans)<0.001,raw,money(q.ans))};
    $("#lock").onclick=sub;$("#ans").onkeydown=e=>{if(e.key==="Enter")sub()};$("#ans").focus();
  }
}

/* ---------- Allergens ---------- */
let A={sel:new Set()};
function renderAl(){
  const v=$("#view");
  let h=`<p class="stat">Tap the allergens a guest has. See which dishes to avoid, and which to ask the kitchen about.</p>
  <div class="chips" role="group" aria-label="Allergens">${ALL.map(([k,n])=>`<button class="chip" aria-pressed="${A.sel.has(k)}" data-a="${k}">${n}</button>`).join("")}</div>`;
  if(!A.sel.size){h+=`<p class="nodata">Nothing selected yet.</p>`}
  else{
    const sel=[...A.sel];
    const like=D.filter(d=>sel.some(k=>d.likely.includes(k)));
    const chk=D.filter(d=>!like.includes(d)&&sel.some(k=>d.check.includes(k)));
    const none=D.filter(d=>!like.includes(d)&&!chk.includes(d));
    const list=(arr,mode)=>arr.map(d=>{const hit=sel.filter(k=>mode==="l"?d.likely.includes(k):d.check.includes(k)).map(k=>AN[k]);return `<details class="dish"><summary><span>${esc(d.name)}</span><span class="p">${hit.length?hit.join(", "):money(d.price)}</span></summary><div class="in"><div class="tags">${alTags(d)}</div><p class="blk say">${esc(d.desc)}</p></div></details>`}).join("")||`<p class="nodata">None.</p>`;
    h+=`<p class="group" style="color:var(--rust)">Do not serve: likely contains (${like.length})</p>${list(like,"l")}
    <p class="group">Ask the kitchen first (${chk.length})</p>${list(chk,"c")}
    <p class="group">Nothing flagged in this draft (${none.length})</p><p class="nodata" style="margin:0 0 8px">Not the same as safe. Confirm with the kitchen, and mention cross-contact in shared fryers.</p>${list(none,"n")}`;
  }
  v.innerHTML=h;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const k=b.dataset.a;A.sel.has(k)?A.sel.delete(k):A.sel.add(k);renderAl()});
}

/* ---------- Menu ---------- */
let M={q:""};
function renderMenu(){
  const v=$("#view");
  v.innerHTML=`<label class="sr" for="s">Search the menu</label><input type="search" id="s" placeholder="Search a dish, ingredient or allergen" value="${esc(M.q)}"><div id="list"></div>
  <p class="legend"><span class="al likely">Filled</span> likely in the dish <span class="al">Outline?</span> ask the kitchen <span>Heat</span> ${heatHTML(2)}</p>`;
  const draw=()=>{
    const q=M.q.trim().toLowerCase();
    const match=d=>!q||[d.name,d.desc,...d.ing,...d.likely.map(k=>AN[k]),...d.check.map(k=>AN[k])].join(" ").toLowerCase().includes(q);
    $("#list").innerHTML=Object.entries(SECS).map(([k,s])=>{
      const a=D.filter(d=>d.s===k&&match(d));if(!a.length)return"";
      return `<h2 class="sech">${s.n}<small>${s.t}</small></h2>`+a.map(d=>`<details class="dish"><summary><span>${esc(d.name)}</span><span class="p">${money(d.price)}</span></summary><div class="in"><p class="blk">${esc(d.desc)}</p><div><p class="lab">Key ingredients</p><div class="tags">${d.ing.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div><div><p class="lab">Flavour</p><p class="blk">${esc(d.flavour)} ${heatHTML(d.heat)}</p></div><div><p class="lab">Allergens (draft)</p><div class="tags">${alTags(d)}</div>${d.diet?`<p class="nodata" style="margin:6px 0 0">${esc(d.diet)}</p>`:""}</div><div><p class="lab">Say it like this</p><p class="blk say">“${esc(d.say)}”</p></div></div></details>`).join("");
    }).join("")||`<p class="nodata">No match.</p>`;
  };
  draw();$("#s").oninput=e=>{M.q=e.target.value;draw()};
}

function show(t){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));

  try{localStorage.setItem("lb-tab",t)}catch(e){}
}
